# Central knobs. Code should read this file rather than hardcoding constants,
# so every rung of the ladder shares the same assumptions.

data:
  bar_timeframe: "1Min"
  adjustment: "all"          # split+dividend adjusted; keep consistent across all bar fetches
  historical_years: 3
  data_dir: "data"           # relative to project root; gitignored

session:
  calendar: "XNYS"           # pandas_market_calendars code for NYSE

windows:
  window_minutes: 90         # TCN-VAE input window length
  stride_minutes: 10         # subsample stride to keep window count CPU-tractable

cv:
  n_splits: 6
  embargo_minutes: 60        # gap on either side of each test fold, in addition to purging

hawkes:
  kernel: "exponential"
  published_branching_ratio: 0.81   # Filimonov & Sornette (2012), E-mini S&P 500, TICK-level trade data
  plausible_band: [0.5, 0.95]       # applies ONLY to the real-tick replication (tick_events_from_recorder) -- see diagnostics/2026-08-11-hawkes-bar-proxy-underdispersion/
  bar_proxy_max_branching_ratio: 0.15  # minute-bar events are structurally near-regular (Fano factor 0.82 on real SPY data), not bursty -- a low/near-zero ratio here is the CORRECT expected result, not a failure
  bar_event_sigma_threshold: 2.0    # for the coarse bar-threshold proxy point process

rpca:
  lambda_scale: 1.0          # multiplier on the default 1/sqrt(max(n,d)) lambda
  max_iter: 1000
  tol: 1.0e-7

attribution:
  match_window_minutes: 30   # fallback only, used when a ticker has zero news events to calibrate against
  target_null_rate: 0.2      # per-ticker match_window is calibrated so a random timestamp matches ~this often -- see attribution/null_control.py::calibrate_match_window. Fixes real saturation seen at 30min flat on high-coverage tickers (WMT/GS/JPM/BA/CVX ~100% real AND null match rate -- zero power to distinguish signal from noise)
  n_permutations: 2000
  sidak_alpha: 0.05
